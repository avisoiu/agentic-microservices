# Ollama runs on the host (GPU). This selector-less Service gives it a cluster DNS
# name; scripts/cluster-up.sh creates the matching EndpointSlice with the address
# of the kind Docker network gateway, which is only known at runtime.
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
