# mcp-toolbox configuration: tools served over MCP at http://toolbox:5000/mcp.
# GITHUB_AUTHORIZATION is "Bearer <token>" or empty (unauthenticated: 60 req/h).
kind: source
name: github
type: http
baseUrl: https://api.github.com
timeout: 15s
headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
  Authorization: ${GITHUB_AUTHORIZATION}
---
kind: tool
name: get_github_repo
type: http
source: github
method: GET
path: /repos/{{.owner}}/{{.repo}}
description: >-
  Get information about a public GitHub repository: description, primary language,
  stars, forks, open issues, license, default branch and last push time.
pathParams:
  - name: owner
    type: string
    description: Repository owner (user or organisation), e.g. "kubernetes"
  - name: repo
    type: string
    description: Repository name, e.g. "kubernetes"
---
kind: tool
name: get_github_latest_release
type: http
source: github
method: GET
path: /repos/{{.owner}}/{{.repo}}/releases/latest
description: Get the latest published release (tag, name, date, notes) of a GitHub repository.
pathParams:
  - name: owner
    type: string
    description: Repository owner (user or organisation)
  - name: repo
    type: string
    description: Repository name
---
kind: toolset
name: default
tools:
  - get_github_repo
  - get_github_latest_release
