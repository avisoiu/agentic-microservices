# OpenTelemetry Collector config: OTLP in from every service, traces out to Jaeger.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  # ASGI instrumentation emits a span per "http send"/"http receive" message and
  # zero-code instrumentation offers no env knob to disable them; drop them here.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, " http (send|receive)$")'
        # Redis PINGs from /readyz checks (the /readyz span itself is excluded at source).
        - 'name == "PING"'
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/noise, batch]
      exporters: [otlp/jaeger, debug]
