# LiteLLM proxy config. Agents only ever ask for "agent-model"; the router tries
# local Ollama first and falls back to the cloud deployment on failure.
model_list:
  - model_name: agent-model
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: os.environ/OLLAMA_API_BASE
      keep_alive: 30m
  - model_name: agent-model-cloud
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: embed-model
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE

router_settings:
  fallbacks:
    - agent-model: ["agent-model-cloud"]
  num_retries: 0
  timeout: 180

litellm_settings:
  drop_params: true
  callbacks: ["otel"]
