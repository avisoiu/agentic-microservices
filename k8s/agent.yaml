apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 8000
---
# External entry point: kind maps node port 30080 to localhost:8080 (see kind-config.yaml).
apiVersion: v1
kind: Service
metadata:
  name: agent-external
spec:
  type: NodePort
  selector:
    app: agent
  ports:
    - name: http
      port: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: agent-stack/agent:dev
          imagePullPolicy: Never # loaded into kind by scripts/cluster-up.sh
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: stack-env
          env:
            - name: OTEL_SERVICE_NAME
              value: agent
            - name: AGENT_MODEL
              value: agent-model
            - name: MAX_TOOL_ROUNDS
              value: "3"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          lifecycle:
            # Keep serving while kube-proxy removes the pod from the NodePort's
            # endpoints; without this, requests during a rollout get reset.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
