apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
labels:
  - pairs:
      app.kubernetes.io/part-of: agent-stack
resources:
  - namespace.yaml
  - redis.yaml
  - qdrant.yaml
  - jaeger.yaml
  - otel-collector.yaml
  - ollama.yaml
  - llm-proxy.yaml
  - prompt-registry.yaml
  - memory.yaml
  - toolbox.yaml
  - agent.yaml
configMapGenerator:
  # Shared, non-secret wiring. Every component finds the others by Service name.
  - name: stack-env
    literals:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_PYTHON_FASTAPI_EXCLUDED_URLS=healthz,readyz
      - MEM0_TELEMETRY=False
      - OLLAMA_API_BASE=http://ollama:11434
      - LLM_PROXY_URL=http://llm-proxy:4000
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEMORY_URL=http://memory:8000
      - PROMPT_REGISTRY_URL=http://prompt-registry:8000
      - TOOLBOX_URL=http://toolbox:5000
  - name: litellm-config
    files:
      - config/litellm.yaml
  - name: otel-collector-config
    files:
      - config.yaml=config/otel-collector.yaml
  - name: toolbox-config
    files:
      - tools.yaml=config/toolbox.yaml
